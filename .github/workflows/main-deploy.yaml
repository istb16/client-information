name: Deploy client-information

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      working-directory: ./
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: install
        working-directory: ${{ env.working-directory }}
        run: npm ci
      - name: Test
        working-directory: ${{ env.working-directory }}
        run: npm run test
      - name: Build
        working-directory: ${{ env.working-directory }}
        run: npm run build
      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLIENT_INFORMATION_CA104 }}'
          channelId: live
          projectId: client-information-ca104